# ══════════════════════════════════════════════════════════════
# CONFIGURATION DES PORTS — fichier .env
#
# Tous les ports sont configurables via le fichier .env
# à la racine du projet. Ne jamais modifier ce fichier
# directement pour changer les ports.
#
# Exemple de fichier .env :
#   APP_PORT=3000
#   MYSQL_PORT=3306
#
# Valeurs par défaut utilisées si .env absent ou variable non définie.
# ══════════════════════════════════════════════════════════════

services:

  # ── Application Next.js ───────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.working
      args:
        NODE_ENV: production
        PORT: ${APP_PORT:-3000}        # Passe le port au build Docker
    container_name: dao-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"        # Défaut : 3000
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER:-dao_user}
      - DB_PASSWORD=${MYSQL_PASSWORD:-dao_secure_password_2024}
      - DB_NAME=${MYSQL_DATABASE:-dao}
      - NEXTAUTH_URL=http://localhost:${APP_PORT:-3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your_super_secret_key_change_this_in_production}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER:-your_email@gmail.com}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-your_app_password}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@dao-project.com}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-DAO Project}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    networks:
      - dao-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-3000}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Base de données MySQL ──────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: dao-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"      # Défaut : 3306
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_secure_password_2024}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-dao}
      - MYSQL_USER=${MYSQL_USER:-dao_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-dao_secure_password_2024}
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_config:/etc/mysql/conf.d
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dao-network
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=256M
      --max-connections=100
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "${MYSQL_USER:-dao_user}",
             "-p${MYSQL_PASSWORD:-dao_secure_password_2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s



# ── Volumes persistants ────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  mysql_config:
    driver: local
  app_uploads:
    driver: local
  app_logs:
    driver: local

# ── Réseau privé ───────────────────────────────────────────
networks:
  dao-network:
    driver: bridge
    ipam:
      config:
        - subnet: "${DOCKER_SUBNET:-172.25.0.0/16}"
          gateway: "${DOCKER_GATEWAY:-172.25.0.1}"