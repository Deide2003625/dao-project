
services:
  # Application Next.js
  app:
    build:
      context: .
      dockerfile: Dockerfile.working
      args:
        NODE_ENV: production
    container_name: dao-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=dao_user
      - DB_PASSWORD=dao_secure_password_2024
      - DB_NAME=dao_project
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=your_super_secret_key_change_this_in_production
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USER=your_email@gmail.com
      - EMAIL_PASSWORD=your_app_password
      - EMAIL_FROM=noreply@dao-project.com
      - EMAIL_FROM_NAME=DAO Project
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    networks:
      - dao-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Base de données MySQL
  mysql:
    image: mysql:8.0
    container_name: dao-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_secure_password_2024
      - MYSQL_DATABASE=dao_project
      - MYSQL_USER=dao_user
      - MYSQL_PASSWORD=dao_secure_password_2024
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_config:/etc/mysql/conf.d
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dao-network
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=256M
      --max-connections=100
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "dao_user", "-pdao_secure_password_2024"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis pour le cache et les sessions
  redis:
    image: redis:7-alpine
    container_name: dao-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - redis_config:/usr/local/etc/redis
    networks:
      - dao-network
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: dao-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
      - ssl_certs:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - dao-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PHPMyAdmin pour la gestion de la BDD (optionnel)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: dao-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql
      - PMA_USER=dao_user
      - PMA_PASSWORD=dao_secure_password_2024
      - MYSQL_ROOT_PASSWORD=root_secure_password_2024
    depends_on:
      - mysql
    networks:
      - dao-network
    profiles:
      - admin

# Volumes persistants
volumes:
  mysql_data:
    driver: local
  mysql_config:
    driver: local
  redis_data:
    driver: local
  redis_config:
    driver: local
  app_uploads:
    driver: local
  app_logs:
    driver: local
  nginx_logs:
    driver: local
  ssl_certs:
    driver: local

# Réseau privé
networks:
  dao-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
