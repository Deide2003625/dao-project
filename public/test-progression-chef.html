<!DOCTYPE html>
<html>
<head>
    <title>Test Progression Chef Projet</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .progress-bar { width: 100%; height: 20px; background: #f0f0f0; border-radius: 10px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; transition: width 0.3s ease; }
        button { margin: 5px; padding: 10px; }
        .result { margin: 10px 0; padding: 10px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Test Barre de Progression - Chef Projet</h1>
    
    <div class="test-section">
        <h3>Test API DAO pour Chef Projet</h3>
        <button onclick="testChefDaoAPI()">Tester API /api/dao?chefId=</button>
        <div id="result-dao" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>Test API Tâches pour Progression</h3>
        <button onclick="testTasksAPI()">Tester API /api/tasks?daoId=</button>
        <div id="result-tasks" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>Test Calcul Progression</h3>
        <button onclick="testProgression()">Calculer Progression</button>
        <div id="result-progression" class="result"></div>
    </div>

    <script>
        async function testChefDaoAPI() {
            const resultDiv = document.getElementById('result-dao');
            resultDiv.innerHTML = 'Test en cours...';
            
            try {
                // Test avec l'ID du chef de projet (à adapter)
                const response = await fetch('/api/dao?chefId=41');
                const data = await response.json();
                
                if (response.ok) {
                    let html = `<div class="success">✅ API DAO fonctionne!</div>`;
                    html += `<p>Nombre de DAO: ${data.data?.length || 0}</p>`;
                    
                    if (data.data && data.data.length > 0) {
                        html += '<h4>DAOs trouvés:</h4>';
                        data.data.forEach(dao => {
                            html += `<p>DAO ${dao.numero}: ${dao.objet || dao.reference} (ID: ${dao.id})</p>`;
                        });
                    }
                    
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ Erreur: ${data.message || 'Erreur inconnue'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">💥 Erreur réseau: ${error.message}</div>`;
            }
        }
        
        async function testTasksAPI() {
            const resultDiv = document.getElementById('result-tasks');
            resultDiv.innerHTML = 'Test en cours...';
            
            try {
                // Test avec un ID de DAO (à adapter)
                const response = await fetch('/api/tasks?daoId=70');
                const data = await response.json();
                
                if (response.ok) {
                    let html = `<div class="success">✅ API Tâches fonctionne!</div>`;
                    html += `<p>Nombre de tâches: ${data.data?.length || 0}</p>`;
                    
                    if (data.data && data.data.length > 0) {
                        html += '<h4>Tâches trouvées:</h4>';
                        let totalProgress = 0;
                        data.data.forEach(task => {
                            html += `<p>Tâche ${task.id}: ${task.titre || 'Sans titre'} - Progression: ${task.progress}%</p>`;
                            totalProgress += task.progress || 0;
                        });
                        
                        const avgProgress = Math.round(totalProgress / data.data.length);
                        html += `<h4>Progression moyenne: ${avgProgress}%</h4>`;
                        
                        // Barre de progression visuelle
                        html += `
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${avgProgress}%; background: ${avgProgress === 100 ? '#28a745' : avgProgress > 0 ? '#007bff' : '#6c757d'}"></div>
                            </div>
                        `;
                    }
                    
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ Erreur: ${data.message || 'Erreur inconnue'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">💥 Erreur réseau: ${error.message}</div>`;
            }
        }
        
        async function testProgression() {
            const resultDiv = document.getElementById('result-progression');
            resultDiv.innerHTML = 'Test en cours...';
            
            try {
                // 1. Récupérer les DAOs du chef
                const daoResponse = await fetch('/api/dao?chefId=41');
                const daoData = await daoResponse.json();
                
                if (!daoResponse.ok) {
                    throw new Error(daoData.message || 'Erreur API DAO');
                }
                
                let html = `<div class="success">✅ Test progression complet!</div>`;
                
                if (daoData.data && daoData.data.length > 0) {
                    // 2. Pour chaque DAO, calculer la progression
                    for (const dao of daoData.data) {
                        const tasksResponse = await fetch(`/api/tasks?daoId=${dao.id}`);
                        const tasksData = await tasksResponse.json();
                        
                        let progression = 0;
                        if (tasksResponse.ok && tasksData.data && tasksData.data.length > 0) {
                            const totalProgress = tasksData.data.reduce((sum, task) => sum + (task.progress || 0), 0);
                            progression = Math.round(totalProgress / tasksData.data.length);
                        }
                        
                        html += `
                            <div style="margin: 15px 0; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                                <h5>DAO ${dao.numero}: ${dao.objet || dao.reference}</h5>
                                <p>Progression: ${progression}%</p>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${progression}%; background: ${progression === 100 ? '#28a745' : progression > 0 ? '#007bff' : '#6c757d'}"></div>
                                </div>
                                <p>Tâches: ${tasksData.data?.length || 0}</p>
                            </div>
                        `;
                    }
                } else {
                    html += '<p>Aucun DAO trouvé pour ce chef de projet</p>';
                }
                
                resultDiv.innerHTML = html;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">💥 Erreur: ${error.message}</div>`;
            }
        }
        
        // Test automatique au chargement
        window.onload = function() {
            console.log('Page de test chargée. Vous pouvez tester les APIs manuellement.');
        };
    </script>
</body>
</html>
