name: SAST & Security Scan

on:
  pull_request:

jobs:
  security-scan:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      ################################################
      # SEMGREP
      ################################################
      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep --config=p/security-audit --json -o semgrep-report.json

      ################################################
      # GITLEAKS
      ################################################
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --report-format json --report-path gitleaks-report.json

      ################################################
      # TRIVY (SCA / Container scan)
      ################################################
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "docker.io/bearer/bearer:latest"
          format: "json"
          output: "trivy-report.json"
          exit-code: 0
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      ################################################
      # CODEQL
      ################################################
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      ################################################
      # GENERATE PROFESSIONAL REPORT
      ################################################
      - name: Generate Markdown Report
        run: |
          echo "# RAPPORT D’AUDIT DE SÉCURITÉ" > report.md
          echo "" >> report.md
          echo "Date : $(date)" >> report.md
          echo "Repository : ${{ github.repository }}" >> report.md
          echo "" >> report.md

          echo "## 1. Résumé Exécutif" >> report.md
          echo "Analyse automatisée via pipeline DevSecOps." >> report.md
          echo "" >> report.md

          echo "## 2. Outils utilisés" >> report.md
          echo "- Semgrep (SAST)" >> report.md
          echo "- Gitleaks (Secrets detection)" >> report.md
          echo "- Trivy (SCA / Container security)" >> report.md
          echo "- CodeQL (Static Code Analysis)" >> report.md
          echo "" >> report.md

          echo "## 3. Résultats Semgrep" >> report.md
          echo "\`\`\`json" >> report.md
          cat semgrep-report.json >> report.md || echo "Aucun résultat." >> report.md
          echo "\`\`\`" >> report.md
          echo "" >> report.md

          echo "## 4. Résultats Gitleaks" >> report.md
          echo "\`\`\`json" >> report.md
          cat gitleaks-report.json >> report.md || echo "Aucun secret détecté." >> report.md
          echo "\`\`\`" >> report.md
          echo "" >> report.md

          echo "## 5. Résultats Trivy" >> report.md
          echo "\`\`\`json" >> report.md
          cat trivy-report.json >> report.md || echo "Aucune vulnérabilité critique." >> report.md
          echo "\`\`\`" >> report.md
          echo "" >> report.md

          echo "## 6. Conclusion" >> report.md
          echo "Le rapport présente les vulnérabilités détectées automatiquement." >> report.md

      ################################################
      # INSTALL PDF ENGINE
      ################################################
      - name: Install Pandoc + XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex

      ################################################
      # CONVERT TO PDF
      ################################################
      - name: Generate PDF
        run: |
          pandoc report.md -o rapport-audit-securite.pdf --pdf-engine=xelatex

      ################################################
      # UPLOAD ARTIFACTS
      ################################################
      - name: Upload PDF Report
        uses: actions/upload-artifact@v4
        with:
          name: Rapport-Audit-Securite
          path: rapport-audit-securite.pdf

      - name: Upload Raw Reports
        uses: actions/upload-artifact@v4
        with:
          name: Security-JSON-Reports
          path: |
            semgrep-report.json
            gitleaks-report.json
            trivy-report.json
