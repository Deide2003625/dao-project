name: SAST Scan
on: pull_request

jobs:
  semgrep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/security-audit

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
              image-ref: "docker.io/bearer/bearer:latest"
              format: "table"
              exit-code: 0
              ignore-unfixed: true
              vuln-type: "os,library"
              severity: "CRITICAL,HIGH"

  analyze:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript # Remplacez par le langage de votre projet
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    # ==========================
    # 🔽 AJOUT EXPORT RAPPORT PDF
    # ==========================

    - name: Install Pandoc
      run: sudo apt-get update && sudo apt-get install -y pandoc

    - name: Generate PDF report
      run: |
        echo "# Rapport SAST" > report.md
        echo "Analyse générée automatiquement par GitHub Actions." >> report.md
        pandoc report.md -o rapport-sast.pdf

    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: rapport-sast
        path: rapport-sast.pdf
