name: Full Security Scan with Reports

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  sast:
    name: Run SAST & Generate Reports
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Verify Node & npm
      - name: Verify Node & npm
        run: |
          node -v
          npm -v
          pwd
          ls -la

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 5️⃣ npm audit + HTML report
      - name: Run npm audit
        run: |
          if [ -f package.json ]; then
            npm audit --json > audit.json
            npx audit-html -f audit.json -o audit-report.html
          else
            echo "No package.json found, skipping npm audit"
          fi


      # 6️⃣ Semgrep SAST
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/security-audit"
          format: json
          output: semgrep-results.json
      - name: Upload Semgrep JSON report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-json-report
          path: semgrep-results.json

      # 7️⃣ Gitleaks secrets scan
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 8️⃣ Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      # 9️⃣ Autobuild for CodeQL
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      # 🔟 CodeQL Analysis
      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results.sarif

      # 1️⃣1️⃣ Upload CodeQL SARIF
      - name: Upload CodeQL SARIF
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: codeql-results.sarif
