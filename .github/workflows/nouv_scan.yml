name: 🔐 Security Scan (ZAP)

on:
  push:
    branches: [ "main", "develop", "feature/Correction_v1" ]
  pull_request:
    branches: [ "main" ]

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Node 20 obligatoire
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ⚠️ Désactiver Turbopack (important)
      - name: Build app
        run: NEXT_DISABLE_TURBOPACK=1 npm run build

      - name: Start app
        run: |
          npm run start &
          sleep 15

      - name: Check app
        run: curl -I http://localhost:3000

      - name: ZAP Scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: 'http://localhost:3000'
          cmd_options: '-a'

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html