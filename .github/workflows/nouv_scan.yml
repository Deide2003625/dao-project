name: 🔐 Security Scan (ZAP)

on:
  push:
    branches: [ "main", "develop", "feature/Correction_v1" ]
  pull_request:
    branches: [ "main" ]

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 🟢 Node 20 (FIX PRINCIPAL)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 🔍 Vérification version
      - name: Check Node version
        run: node -v

      # 📦 Install
      - name: Install dependencies
        run: npm ci

      # 🏗️ Build
      - name: Build app
        run: npm run build

      # 🚀 Start app
      - name: Start app
        run: |
          npm run start &
          sleep 15

      # 🔍 Vérifier disponibilité
      - name: Wait for app
        run: |
          curl --retry 5 --retry-delay 5 --retry-connrefused http://localhost:3000

      # 🧪 Test sécurité rapide (Path Traversal)
      - name: Test Path Traversal
        run: |
          if curl -s "http://localhost:3000/_next/image?url=../../etc/passwd" | grep "root"; then
            echo "❌ Path Traversal vulnerability detected"
            exit 1
          else
            echo "✅ Path Traversal safe"
          fi

      # 🛡️ ZAP Scan
      - name: ZAP Scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: 'http://localhost:3000'
          fail_action: false   # ⚠️ mets true quand tout est stable
          cmd_options: '-a'

      # 📊 Upload rapport
      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html