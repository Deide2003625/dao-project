name: 🔐 Security Hardening — Fix ZAP Vulnerabilities

on:
  push:
    branches: 
      - main
      - develop
      - feature/Docker_v2
  pull_request:
    branches: 
      - main
      - develop
      - feature/Docker_v2
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 : Audit & patch automatique des headers
  # ─────────────────────────────────────────────
  security-headers:
    name: 🛡️ Patch Security Headers (next.config.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 🔧 Patch next.config.js — Inject all security headers
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');

          const configPath = path.join(process.cwd(), 'next.config.js');
          let config = fs.existsSync(configPath)
            ? fs.readFileSync(configPath, 'utf8')
            : '/** @type {import("next").NextConfig} */\nconst nextConfig = {};\nmodule.exports = nextConfig;\n';

          // Headers de sécurité complets (corrige CSP, X-Frame-Options, CORP, COOP,
          // COEP, Permissions-Policy, X-Content-Type-Options, X-Powered-By)
          const securityHeaders = `
          async headers() {
            return [
              {
                source: '/(.*)',
                headers: [
                  // ✅ FIX: Content Security Policy (Medium — CWE-693)
                  {
                    key: 'Content-Security-Policy',
                    value: [
                      "default-src 'self'",
                      "script-src 'self' 'unsafe-inline' cdn.jsdelivr.net code.jquery.com",
                      "style-src 'self' 'unsafe-inline' fonts.googleapis.com",
                      "font-src 'self' fonts.gstatic.com",
                      "img-src 'self' data: blob:",
                      "connect-src 'self'",
                      "frame-ancestors 'none'",
                      "base-uri 'self'",
                      "form-action 'self'",
                    ].join('; '),
                  },
                  // ✅ FIX: Anti-clickjacking (Medium — CWE-1021)
                  {
                    key: 'X-Frame-Options',
                    value: 'DENY',
                  },
                  // ✅ FIX: X-Content-Type-Options (Low — CWE-693)
                  {
                    key: 'X-Content-Type-Options',
                    value: 'nosniff',
                  },
                  // ✅ FIX: Cross-Origin-Resource-Policy (Low — CWE-346)
                  {
                    key: 'Cross-Origin-Resource-Policy',
                    value: 'same-origin',
                  },
                  // ✅ FIX: Cross-Origin-Opener-Policy (Low — CWE-346)
                  {
                    key: 'Cross-Origin-Opener-Policy',
                    value: 'same-origin-allow-popups',
                  },
                  // ✅ FIX: Cross-Origin-Embedder-Policy (Low — CWE-693)
                  {
                    key: 'Cross-Origin-Embedder-Policy',
                    value: 'unsafe-none',
                  },
                  // ✅ FIX: Permissions-Policy (Low — CWE-693)
                  {
                    key: 'Permissions-Policy',
                    value: [
                      'camera=()',
                      'microphone=()',
                      'geolocation=()',
                      'payment=()',
                      'usb=()',
                      'fullscreen=(self)',
                    ].join(', '),
                  },
                  // Referrer-Policy bonus
                  {
                    key: 'Referrer-Policy',
                    value: 'strict-origin-when-cross-origin',
                  },
                ],
              },
            ];
          },`;

          // Injection dans la config existante ou création d'une nouvelle
          if (config.includes('async headers()')) {
            console.log('⚠️  headers() déjà présent — vérification manuelle requise.');
          } else {
            // Insérer avant le module.exports final
            const newConfig = \`/** @type {import("next").NextConfig} */
          const nextConfig = {
            // ✅ FIX: Supprimer X-Powered-By (Low — CWE-200)
            poweredByHeader: false,

            \${securityHeaders}

            // ✅ FIX: Path Traversal sur _next/image (High — CWE-541)
            // Restreindre les domaines autorisés pour l'optimisation d'images
            images: {
              remotePatterns: [
                {
                  protocol: 'https',
                  hostname: process.env.NEXT_PUBLIC_DOMAIN || 'localhost',
                  pathname: '/images/**',
                },
              ],
              // Désactiver l'accès aux chemins arbitraires
              dangerouslyAllowSVG: false,
              contentDispositionType: 'attachment',
              contentSecurityPolicy: "default-src 'self'; script-src 'none'; sandbox;",
            },
          };

          module.exports = nextConfig;
          \`;
            fs.writeFileSync(configPath, newConfig, 'utf8');
            console.log('✅ next.config.js patché avec tous les headers de sécurité.');
          }
          EOF

      - name: Upload patched config
        uses: actions/upload-artifact@v4
        with:
          name: patched-next-config
          path: next.config.js

  # ─────────────────────────────────────────────
  # JOB 2 : Fix Path Traversal (HIGH - CWE-541)
  # ─────────────────────────────────────────────
  fix-path-traversal:
    name: 🔴 Fix Path Traversal — _next/image (HIGH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔧 Créer middleware de validation de chemin
        run: |
          mkdir -p src/middleware
          cat > src/middleware/imagePathGuard.ts << 'EOF'
          /**
           * ✅ FIX: Path Traversal sur /_next/image (High — CWE-541 / WASC-33)
           *
           * Ce middleware valide le paramètre "url" de l'endpoint Next.js Image
           * pour empêcher l'accès à des fichiers arbitraires du serveur.
           */
          import { NextResponse } from 'next/server';
          import type { NextRequest } from 'next/server';

          const ALLOWED_URL_PREFIXES = [
            '/images/',
            '/public/',
            '/assets/',
            '/static/',
          ];

          const ALLOWED_EXTERNAL_DOMAINS = (
            process.env.NEXT_PUBLIC_ALLOWED_IMAGE_DOMAINS || ''
          )
            .split(',')
            .map((d) => d.trim())
            .filter(Boolean);

          export function validateImageUrl(urlParam: string | null): boolean {
            if (!urlParam) return false;

            try {
              // Détecter les tentatives de Path Traversal
              const decoded = decodeURIComponent(urlParam);
              const dangerousPatterns = [
                '../', '..\\', '%2e%2e', '%2f', '%5c',
                '..%2f', '..%5c', '%252e%252e',
              ];

              for (const pattern of dangerousPatterns) {
                if (decoded.toLowerCase().includes(pattern.toLowerCase())) {
                  console.warn(`[Security] Path traversal bloqué: ${urlParam}`);
                  return false;
                }
              }

              // URL relative : vérifier qu'elle pointe vers /images/ ou /public/
              if (urlParam.startsWith('/')) {
                return ALLOWED_URL_PREFIXES.some((prefix) =>
                  urlParam.startsWith(prefix)
                );
              }

              // URL absolue : vérifier le domaine
              const parsed = new URL(urlParam);
              return ALLOWED_EXTERNAL_DOMAINS.includes(parsed.hostname);
            } catch {
              return false;
            }
          }

          export function imageGuardMiddleware(request: NextRequest) {
            if (request.nextUrl.pathname === '/_next/image') {
              const urlParam = request.nextUrl.searchParams.get('url');

              if (!validateImageUrl(urlParam)) {
                return NextResponse.json(
                  { error: 'Invalid image URL' },
                  { status: 400 }
                );
              }
            }

            return NextResponse.next();
          }
          EOF
          echo "✅ Middleware imagePathGuard créé."

      - name: 🔧 Créer/Mettre à jour middleware.ts principal
        run: |
          cat > src/middleware.ts << 'EOF'
          import { NextResponse } from 'next/server';
          import type { NextRequest } from 'next/server';
          import { imageGuardMiddleware } from './middleware/imagePathGuard';

          export function middleware(request: NextRequest) {
            // ✅ FIX: Path Traversal — validation de l'URL image
            const imageGuardResponse = imageGuardMiddleware(request);
            if (imageGuardResponse.status === 400) {
              return imageGuardResponse;
            }

            return NextResponse.next();
          }

          export const config = {
            matcher: ['/_next/image', '/api/:path*'],
          };
          EOF
          echo "✅ middleware.ts mis à jour."

      - name: Upload middleware files
        uses: actions/upload-artifact@v4
        with:
          name: security-middleware
          path: src/middleware*

  # ─────────────────────────────────────────────
  # JOB 3 : Fix JS dangereux + commentaires
  # ─────────────────────────────────────────────
  fix-dangerous-js:
    name: 🟡 Fix Dangerous JS + Suspicious Comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install audit tools
        run: npm install -g retire jshint

      - name: 🔍 Scanner les fonctions JS dangereuses
        run: |
          echo "=== Scan des fonctions dangereuses ==="
          echo "--- innerHTML ---"
          grep -rn "innerHTML\s*=" --include="*.js" --include="*.ts" --include="*.tsx" --include="*.jsx" src/ || echo "Aucun innerHTML trouvé"
          echo "--- eval() ---"
          grep -rn "\beval\s*(" --include="*.js" --include="*.ts" --include="*.tsx" --include="*.jsx" src/ || echo "Aucun eval trouvé"
          echo "--- document.write ---"
          grep -rn "document\.write\s*(" --include="*.js" --include="*.ts" --include="*.tsx" --include="*.jsx" src/ || echo "Aucun document.write trouvé"
          echo "--- Suspicious comments ---"
          grep -rn "TODO\|FIXME\|password\|secret\|admin\|hack\|debug\|token" --include="*.js" --include="*.ts" --include="*.tsx" --include="*.jsx" src/ || echo "Aucun commentaire suspect trouvé"

      - name: 🔧 Installer DOMPurify pour assainir le HTML
        run: |
          npm install dompurify @types/dompurify --save
          echo "✅ DOMPurify installé."

      - name: 🔧 Créer helper sécurisé pour le DOM
        run: |
          mkdir -p src/utils
          cat > src/utils/safedom.ts << 'EOF'
          /**
           * ✅ FIX: Dangerous JS Functions (Low — CWE-79)
           *
           * Remplacements sécurisés pour innerHTML, eval, document.write
           */
          import DOMPurify from 'dompurify';

          /**
           * Remplace innerHTML= par une version assainie.
           * Usage : setInnerHTML(element, userHtml)
           */
          export function setInnerHTML(element: Element, html: string): void {
            const clean = DOMPurify.sanitize(html, {
              ALLOWED_TAGS: ['b', 'i', 'em', 'strong', 'a', 'p', 'br', 'ul', 'li'],
              ALLOWED_ATTR: ['href', 'title', 'target', 'rel'],
            });
            element.innerHTML = clean;
          }

          /**
           * Remplace textContent de façon sécurisée (pas de XSS possible).
           * Préférer ceci à innerHTML quand le contenu est du texte pur.
           */
          export function setTextContent(element: Element, text: string): void {
            element.textContent = text;
          }

          /**
           * Remplace eval() pour le parsing JSON.
           * Ne jamais utiliser eval() pour parser du JSON.
           */
          export function safeJsonParse<T = unknown>(jsonString: string): T | null {
            try {
              return JSON.parse(jsonString) as T;
            } catch (e) {
              console.error('[Security] Invalid JSON — parsing refusé:', e);
              return null;
            }
          }
          EOF
          echo "✅ Helper safedom.ts créé."

      - name: Upload security utils
        uses: actions/upload-artifact@v4
        with:
          name: security-utils
          path: src/utils/safedom.ts

  # ─────────────────────────────────────────────
  # JOB 4 : Fix SRI (Subresource Integrity)
  # ─────────────────────────────────────────────
  fix-sri:
    name: 🟠 Fix Sub Resource Integrity (SRI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Générer les hashes SRI pour les CDN externes
        run: |
          echo "=== Génération des hashes SRI ==="

          generate_sri() {
            local url=$1
            local name=$2
            echo -n "[$name] Téléchargement... "
            hash=$(curl -sL "$url" | openssl dgst -sha384 -binary | openssl base64 -A)
            if [ -n "$hash" ]; then
              echo "OK"
              echo "  integrity=\"sha384-$hash\""
            else
              echo "ERREUR (URL inaccessible en CI)"
            fi
          }

          generate_sri "https://code.jquery.com/jquery-3.7.1.min.js" "jQuery 3.7.1"
          generate_sri "https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" "Bootstrap JS 5.3.0"
          generate_sri "https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" "Bootstrap CSS 5.3.0"

      - name: 🔧 Créer composant Script sécurisé (Next.js)
        run: |
          mkdir -p src/components
          cat > src/components/ExternalScript.tsx << 'EOF'
          /**
           * ✅ FIX: Sub Resource Integrity Missing (Medium — CWE-353)
           *
           * Composant Next.js qui charge les scripts externes avec SRI.
           * Toujours utiliser ce composant au lieu de <script> direct.
           */

          interface ExternalScriptProps {
            src: string;
            integrity: string;
            crossOrigin?: 'anonymous' | 'use-credentials';
            async?: boolean;
            defer?: boolean;
          }

          export function ExternalScript({
            src,
            integrity,
            crossOrigin = 'anonymous',
            async = true,
            defer = false,
          }: ExternalScriptProps) {
            return (
              // eslint-disable-next-line @next/next/no-sync-scripts
              <script
                src={src}
                integrity={integrity}
                crossOrigin={crossOrigin}
                async={async}
                defer={defer}
              />
            );
          }

          /**
           * Ressources externes pré-configurées avec leur hash SRI.
           * Mettre à jour les hashes à chaque changement de version.
           *
           * Générer : curl -sL <URL> | openssl dgst -sha384 -binary | openssl base64 -A
           */
          export const EXTERNAL_RESOURCES = {
            jquery: {
              src: 'https://code.jquery.com/jquery-3.7.1.min.js',
              integrity: 'sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs',
            },
            bootstrapJs: {
              src: 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js',
              integrity: 'sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz',
            },
          } as const;
          EOF
          echo "✅ ExternalScript.tsx créé avec SRI."

      - name: Upload SRI component
        uses: actions/upload-artifact@v4
        with:
          name: sri-component
          path: src/components/ExternalScript.tsx

  # ─────────────────────────────────────────────
  # JOB 5 : Fix erreurs serveur + Full Path Disclosure
  # ─────────────────────────────────────────────
  fix-error-handling:
    name: 🟡 Fix Full Path Disclosure + Error Handling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Créer gestionnaire d'erreurs sécurisé
        run: |
          mkdir -p src/lib
          cat > src/lib/errorHandler.ts << 'EOF'
          /**
           * ✅ FIX: Full Path Disclosure (Low — CWE-200)
           * ✅ FIX: Information Disclosure (Info — CWE-200)
           *
           * Gestionnaire d'erreurs qui masque les chemins système en production.
           */

          const IS_PROD = process.env.NODE_ENV === 'production';

          export interface SafeError {
            message: string;
            code?: string;
            statusCode: number;
          }

          /**
           * Convertit une erreur brute en réponse sécurisée.
           * En production : message générique. En dev : détails complets.
           */
          export function sanitizeError(error: unknown): SafeError {
            if (error instanceof Error) {
              // Masquer les chemins système (/home/user/app/...) en production
              const message = IS_PROD
                ? getGenericMessage(error)
                : error.message;

              return {
                message,
                code: IS_PROD ? undefined : error.name,
                statusCode: getStatusCode(error),
              };
            }

            return {
              message: IS_PROD ? 'Une erreur est survenue.' : String(error),
              statusCode: 500,
            };
          }

          function getGenericMessage(error: Error): string {
            // Mapper les types d'erreurs courants sans exposer de détails
            if (error.message.includes('ENOENT') || error.message.includes('EACCES')) {
              return 'Ressource non trouvée.';
            }
            if (error.message.includes('ECONNREFUSED') || error.message.includes('ETIMEDOUT')) {
              return 'Service temporairement indisponible.';
            }
            if (error.message.includes('Unauthorized') || error.message.includes('401')) {
              return 'Accès non autorisé.';
            }
            return 'Une erreur interne est survenue.';
          }

          function getStatusCode(error: Error): number {
            if (error.message.includes('404') || error.message.includes('ENOENT')) return 404;
            if (error.message.includes('401') || error.message.includes('Unauthorized')) return 401;
            if (error.message.includes('403') || error.message.includes('Forbidden')) return 403;
            return 500;
          }

          /**
           * Handler pour les API routes Next.js
           */
          export function apiErrorResponse(error: unknown) {
            const safe = sanitizeError(error);

            // Logger l'erreur complète côté serveur (jamais côté client)
            if (!IS_PROD) {
              console.error('[API Error]', error);
            } else {
              // En production : logger sans le stack trace dans la réponse
              console.error('[API Error]', safe.message);
            }

            return Response.json(
              { error: safe.message, ...(safe.code ? { code: safe.code } : {}) },
              { status: safe.statusCode }
            );
          }
          EOF
          echo "✅ errorHandler.ts créé."

      - name: 🔧 Créer page d'erreur personnalisée (masque les chemins)
        run: |
          mkdir -p src/app
          cat > src/app/error.tsx << 'EOF'
          'use client';

          /**
           * ✅ FIX: Full Path Disclosure — page d'erreur qui ne révèle rien du serveur
           */
          export default function Error({
            error,
            reset,
          }: {
            error: Error & { digest?: string };
            reset: () => void;
          }) {
            // Ne jamais afficher error.message ou error.stack au client en production
            const isProduction = process.env.NODE_ENV === 'production';

            return (
              <div style={{ padding: '2rem', textAlign: 'center' }}>
                <h2>Une erreur est survenue</h2>
                {!isProduction && (
                  <details style={{ marginTop: '1rem', textAlign: 'left' }}>
                    <summary>Détails (dev only)</summary>
                    <pre>{error.message}</pre>
                  </details>
                )}
                <button onClick={reset} style={{ marginTop: '1rem' }}>
                  Réessayer
                </button>
              </div>
            );
          }
          EOF
          echo "✅ error.tsx créé."

      - name: Upload error handler
        uses: actions/upload-artifact@v4
        with:
          name: error-handler
          path: |
            src/lib/errorHandler.ts
            src/app/error.tsx

  # ─────────────────────────────────────────────
  # JOB 6 : Fix URL sensitive info + redirects
  # ─────────────────────────────────────────────
  fix-sensitive-url:
    name: 🔵 Fix Sensitive Info in URL + Big Redirect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Créer helper d'authentification sécurisé (POST)
        run: |
          mkdir -p src/lib
          cat > src/lib/authHelper.ts << 'EOF'
          /**
           * ✅ FIX: Sensitive Information in URL (Info — CWE-598)
           *
           * Ne jamais passer email/password/token en paramètre GET.
           * Utiliser POST avec un body JSON chiffré.
           */

          export interface LoginCredentials {
            email: string;
            password: string;
          }

          /**
           * Authentification sécurisée — données envoyées en POST body, pas en URL.
           */
          export async function secureLogin(credentials: LoginCredentials) {
            const response = await fetch('/api/auth/login', {
              method: 'POST',  // ✅ POST — jamais GET
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(credentials),  // ✅ Body JSON — pas de query params
              credentials: 'same-origin',
            });

            if (!response.ok) {
              const error = await response.json().catch(() => ({}));
              throw new Error(error.message || 'Échec de connexion');
            }

            return response.json();
          }

          /**
           * ✅ FIX: Big Redirect — redirection propre sans corps volumineux
           */
          export function safeRedirect(url: string, statusCode: 301 | 302 = 302) {
            // Whitelist des chemins de redirection autorisés
            const allowedPaths = ['/', '/dashboard', '/login', '/home'];
            const isAllowed = allowedPaths.some((p) => url.startsWith(p));

            if (!isAllowed && !url.startsWith(process.env.NEXT_PUBLIC_BASE_URL || '')) {
              console.warn(`[Security] Redirection non autorisée bloquée: ${url}`);
              return '/';
            }

            return url;
          }
          EOF
          echo "✅ authHelper.ts créé."

      - name: Upload auth helper
        uses: actions/upload-artifact@v4
        with:
          name: auth-helper
          path: src/lib/authHelper.ts

  # ─────────────────────────────────────────────
  # JOB 7 : Scan de validation final (ZAP re-scan)
  # ─────────────────────────────────────────────
  security-validation:
    name: 🔍 Validation — Re-scan ZAP
    runs-on: ubuntu-latest
    needs:
      - security-headers
      - fix-path-traversal
      - fix-dangerous-js
      - fix-sri
      - fix-error-handling
      - fix-sensitive-url
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all patches
        uses: actions/download-artifact@v4
        with:
          path: ./patches

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_DOMAIN: localhost

      - name: Start application
        run: |
          npm run start &
          sleep 10
          echo "✅ Application démarrée"
        env:
          NODE_ENV: production
          PORT: 3000

      - name: 🔍 Re-scan ZAP Baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          fail_action: false
        continue-on-error: true

      - name: 📊 Vérification manuelle des headers
        run: |
          echo "=== Vérification des headers de sécurité ==="
          BASE="http://localhost:3000"

          check_header() {
            local header=$1
            local expected=$2
            value=$(curl -sI "$BASE" | grep -i "^$header:" | head -1 | sed 's/^[^:]*: //' | tr -d '\r')
            if echo "$value" | grep -qi "$expected"; then
              echo "✅ $header : OK ($value)"
            else
              echo "❌ $header : MANQUANT ou incorrect (trouvé: '$value')"
            fi
          }

          check_header "content-security-policy" "default-src"
          check_header "x-frame-options" "DENY"
          check_header "x-content-type-options" "nosniff"
          check_header "cross-origin-resource-policy" "same-origin"
          check_header "cross-origin-opener-policy" "same-origin"
          check_header "permissions-policy" "camera"
          check_header "referrer-policy" "strict-origin"

          # Vérifier que X-Powered-By est absent
          powered_by=$(curl -sI "$BASE" | grep -i "x-powered-by")
          if [ -z "$powered_by" ]; then
            echo "✅ X-Powered-By : correctement supprimé"
          else
            echo "❌ X-Powered-By encore présent : $powered_by"
          fi

          # Vérifier Path Traversal bloqué
          pt_response=$(curl -so /dev/null -w "%{http_code}" "$BASE/_next/image?url=../../etc/passwd&w=100&q=75")
          if [ "$pt_response" = "400" ] || [ "$pt_response" = "403" ]; then
            echo "✅ Path Traversal : bloqué (HTTP $pt_response)"
          else
            echo "❌ Path Traversal : non bloqué (HTTP $pt_response)"
          fi

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-rescan-report
          path: report_html.html

  # ─────────────────────────────────────────────
  # JOB 8 : Rapport de synthèse
  # ─────────────────────────────────────────────
  summary-report:
    name: 📋 Rapport de synthèse
