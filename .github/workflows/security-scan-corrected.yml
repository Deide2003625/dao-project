name: SAST & DAST Security Scan

on:
  pull_request:
    branches:
      - feature/Docker
  push:
    branches:
      - feature/Docker

jobs:
  security-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ################################################
      # BUILD APPLICATION FOR DAST
      ################################################
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.working
          push: false
          load: true
          tags: app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start application for DAST
        run: |
          docker run -d \
            --name app-under-test \
            -p 8080:3000 \
            -e NODE_ENV=production \
            -e DB_HOST=mysql \
            -e DB_USER=dao_user \
            -e DB_PASSWORD=dao_secure_password_2024 \
            -e DB_NAME=dao_project \
            app:latest

      ################################################
      # SEMGREP (SAST)
      ################################################
      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep --config=p/security-audit --json -o semgrep-report.json || true
          semgrep --config=p/typescript --json -o semgrep-typescript.json || true

      ################################################
      # GITLEAKS (Secrets detection)
      ################################################
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      ################################################
      # TRIVY (SCA / Container scan)
      ################################################
      - name: Run Trivy on application image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app:latest'
          format: 'json'
          output: 'trivy-report.json'
          exit-code: 0
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      ################################################
      # CODEQL (SAST)
      ################################################
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild CodeQL
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      ################################################
      # WAIT FOR APPLICATION
      ################################################
      - name: Wait for app to be ready
        run: |
          echo "Waiting for application to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "App is up!"
              break
            fi
            echo "Attempt $i/30..."
            sleep 5
          done

      ################################################
      # DAST — OWASP ZAP
      ################################################
      - name: Run OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: 'http://localhost:8080'
          cmd_options: '-a'
          artifact_name: 'zap-report'
          fail_action: false
          allow_issue_writing: false
        continue-on-error: true

      - name: Prepare ZAP reports
        run: |
          mv report_json.json zap-report.json 2>/dev/null || echo '{"results": []}' > zap-report.json
          mv report_html.html zap-report.html 2>/dev/null || echo '<html><body>No ZAP report</body></html>' > zap-report.html

      ################################################
      # DAST — Nuclei
      ################################################
      - name: Install Nuclei
        run: |
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Update Nuclei templates
        run: nuclei -update-templates

      - name: Run Nuclei Scan
        run: |
          nuclei \
            -u http://localhost:8080 \
            -severity critical,high,medium \
            -t cves,misconfiguration,exposures,technologies \
            -json-export nuclei-report.json \
            -silent
        continue-on-error: true

      ################################################
      # DAST — Nikto
      ################################################
      - name: Install Nikto
        run: sudo apt-get install -y nikto

      - name: Run Nikto Scan
        run: |
          nikto \
            -h http://localhost:8080 \
            -Format json \
            -output nikto-report.json \
            -Tuning 123bde \
            -nointeractive
        continue-on-error: true

      ################################################
      # DAST — FFUF
      ################################################
      - name: Install FFUF
        run: |
          go install github.com/ffuf/ffuf/v2@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Download wordlist
        run: |
          curl -sL https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/common.txt \
            -o common.txt

      - name: Run FFUF Directory Fuzzing
        run: |
          ffuf \
            -u http://localhost:8080/FUZZ \
            -w common.txt \
            -mc 200,301,302,403 \
            -o ffuf-report.json \
            -of json \
            -t 50 \
            -timeout 10 \
            -silent
        continue-on-error: true

      ################################################
      # CLEANUP
      ################################################
      - name: Stop application
        run: docker stop app-under-test || true

      ################################################
      # GENERATE REPORT
      ################################################
      - name: Generate Markdown Report
        run: |
          cat > report.md << 'EOF'
      # RAPPORT D'AUDIT DE SÉCURITÉ

      **Date :** $(date)  
      **Repository :** ${{ github.repository }}  
      **Commit :** ${{ github.sha }}

      ## 1. Résumé Exécutif
      Analyse automatisée via pipeline DevSecOps combinant outils SAST et DAST.

      ## 2. Outils utilisés

      ### SAST (Static Application Security Testing)
      - **Semgrep** — Analyse statique du code source
      - **Gitleaks** — Détection de secrets dans l'historique Git  
      - **Trivy** — Analyse des dépendances et images containers (SCA)
      - **CodeQL** — Analyse sémantique du code (GitHub)

      ### DAST (Dynamic Application Security Testing)
      - **OWASP ZAP** — Scan actif OWASP Top 10
      - **Nuclei** — Scan basé sur templates CVE / misconfiguration
      - **Nikto** — Audit des headers et configurations serveur
      - **FFUF** — Fuzzing et découverte d'endpoints cachés

      ## 3. Résultats SAST

      ### Semgrep (Security Audit)
      EOF
          cat semgrep-report.json >> report.md || echo "Aucune vulnérabilité détectée." >> report.md
          cat >> report.md << 'EOF'
      
      ### Semgrep (TypeScript)
      EOF
          cat semgrep-typescript.json >> report.md || echo "Aucune vulnérabilité détectée." >> report.md
          cat >> report.md << 'EOF'
      
      ### Gitleaks (Secrets)
      EOF
          cat gitleaks-report.json >> report.md || echo "Aucun secret détecté." >> report.md
          cat >> report.md << 'EOF'
      
      ### Trivy (SCA)
      EOF
          cat trivy-report.json >> report.md || echo "Aucune vulnérabilité critique." >> report.md
          cat >> report.md << 'EOF'

      ## 4. Résultats DAST

      ### OWASP ZAP
      EOF
          cat zap-report.json >> report.md || echo "Aucune vulnérabilité détectée." >> report.md
          cat >> report.md << 'EOF'
      
      ### Nuclei
      EOF
          cat nuclei-report.json >> report.md || echo "Aucune vulnérabilité détectée." >> report.md
          cat >> report.md << 'EOF'
      
      ### Nikto
      EOF
          cat nikto-report.json >> report.md || echo "Aucune anomalie détectée." >> report.md
          cat >> report.md << 'EOF'
      
      ### FFUF — Endpoints découverts
      EOF
          cat ffuf-report.json >> report.md || echo "Aucun endpoint sensible découvert." >> report.md
          cat >> report.md << 'EOF'

      ## 5. Conclusion
      Le rapport présente l'ensemble des vulnérabilités détectées automatiquement.
      Les résultats DAST portent sur l'application en cours d'exécution et peuvent révéler
      des failles non détectables par l'analyse statique seule.
      EOF

      ################################################
      # INSTALL PDF ENGINE
      ################################################
      - name: Install Pandoc + XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex

      ################################################
      # CONVERT TO PDF
      ################################################
      - name: Generate PDF
        run: |
          pandoc report.md -o rapport-audit-securite.pdf --pdf-engine=xelatex

      ################################################
      # UPLOAD ARTIFACTS
      ################################################
      - name: Upload PDF Report
        uses: actions/upload-artifact@v4
        with:
          name: Rapport-Audit-Securite
          path: rapport-audit-securite.pdf
          retention-days: 30

      - name: Upload ZAP HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: ZAP-HTML-Report
          path: zap-report.html
          retention-days: 30

      - name: Upload Raw Reports
        uses: actions/upload-artifact@v4
        with:
          name: Security-JSON-Reports
          path: |
            semgrep-report.json
            semgrep-typescript.json
            gitleaks-report.json
            trivy-report.json
            zap-report.json
            nuclei-report.json
            nikto-report.json
            ffuf-report.json
          retention-days: 30
