name: 🔒 Security Hardening & ZAP Scan

on:
  workflow_dispatch:
  push:
    branches: [main, develop, "feature/Docker_v2"]
  pull_request:
    branches: [main]

# Politique de sécurité stricte pour les permissions
permissions:
  contents: read  # Lecture seule par défaut
  pull-requests: write  # Pour commenter sur les PRs

# Environnement partagé entre jobs
env:
  NODE_VERSION: '20'
  APP_PORT: 3000
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable
  REGISTRY: ghcr.io

jobs:
  security-hardening:
    name: 🛡️ Apply Security Hardening
    runs-on: ubuntu-latest
    # Permissions spécifiques pour ce job (nécessaire pour commit)
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true  # Important pour les commits

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: 📦 Cache npm dependencies
        uses: actions/cache@v3
        id: npm-cache
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 📦 Install dependencies (with fallback)
        id: install-deps
        run: |
          # Fonction pour logguer proprement
          log() { echo "→ $1"; }
          
          # Sauvegarde du package-lock.json original
          if [ -f package-lock.json ]; then
            cp package-lock.json package-lock.json.backup
          fi
          
          # Tentative 1: npm ci (clean install)
          log "Attempting npm ci..."
          if npm ci; then
            echo "✓ npm ci successful"
            exit 0
          fi
          
          log "⚠ npm ci failed, trying npm install..."
          
          # Tentative 2: régénération du lockfile
          if [ -f package-lock.json ]; then
            rm package-lock.json
          fi
          
          if npm install; then
            echo "✓ npm install successful"
            # Vérifier si le lockfile a changé
            if [ -f package-lock.json.backup ]; then
              if ! cmp -s package-lock.json package-lock.json.backup; then
                echo "📝 package-lock.json has changed, will commit"
                echo "lockfile_changed=true" >> $GITHUB_OUTPUT
              fi
            fi
            exit 0
          fi
          
          log "✗ Both npm ci and npm install failed"
          exit 1

      - name: 🔒 Security Audit & Fix
        run: |
          # Audit des vulnérabilités avec sortie JSON
          npm audit --json > npm-audit-report.json || true
          
          # Correction automatique (niveau high seulement)
          npm audit fix --audit-level=high || true
          
          # Correction forcée uniquement si nécessaire
          if grep -q '"severity":"critical"' npm-audit-report.json 2>/dev/null; then
            echo "⚠ Critical vulnerabilities found, forcing fixes..."
            npm audit fix --force --audit-level=critical || true
          fi

      - name: ⚙️ Generate secure next.config.js
        run: |
          # Template sécurisé avec validation
          cat > next.config.js << 'CONFIGEOF'
          /** @type {import('next').NextConfig} */
          const cspHeader = [
            "default-src 'self'",
            "script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://code.jquery.com",
            "style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com",
            "font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net",
            "img-src 'self' data: blob: https:",
            "connect-src 'self'",
            "frame-ancestors 'none'",
            "object-src 'none'",
            "base-uri 'self'",
            "form-action 'self'",
            "upgrade-insecure-requests"
          ].join('; ');

          const nextConfig = {
            poweredByHeader: false,
            reactStrictMode: true,
            swcMinify: true,
            
            typescript: {
              ignoreBuildErrors: true, // Temporary until manual fixes
            },
            
            // Server external packages
            serverExternalPackages: ['jspdf', 'fflate', 'puppeteer-core'],
            
            // Security headers
            async headers() {
              return [
                {
                  source: '/:path*',
                  headers: [
                    { key: 'Content-Security-Policy', value: cspHeader },
                    { key: 'X-Frame-Options', value: 'DENY' },
                    { key: 'X-Content-Type-Options', value: 'nosniff' },
                    { key: 'Strict-Transport-Security', value: 'max-age=63072000; includeSubDomains; preload' },
                    { key: 'Referrer-Policy', value: 'strict-origin-when-cross-origin' },
                    { key: 'Cross-Origin-Embedder-Policy', value: 'require-corp' },
                    { key: 'Cross-Origin-Opener-Policy', value: 'same-origin' },
                    { key: 'Cross-Origin-Resource-Policy', value: 'same-origin' },
                    { key: 'Permissions-Policy', value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=()' },
                    { key: 'X-DNS-Prefetch-Control', value: 'off' },
                  ],
                },
              ];
            },
          };
          module.exports = nextConfig;
          CONFIGEOF

      - name: 🛡️ Create Security Middleware
        run: |
          mkdir -p src/middleware
          
          # Validation des images
          cat > src/middleware/validateImage.ts << 'EOF'
          import { NextRequest, NextResponse } from 'next/server';

          const ALLOWED_EXTENSIONS = new Set(['jpg', 'jpeg', 'png', 'webp', 'gif', 'svg', 'ico']);
          const ALLOWED_PATHS = ['/images/', '/uploads/', '/public/'];
          const MAX_IMAGE_SIZE = 10 * 1024 * 1024; // 10MB

          export async function validateImageRequest(request: NextRequest): Promise<NextResponse | null> {
            if (!request.nextUrl.pathname.startsWith('/_next/image')) return null;
            
            const url = request.nextUrl.searchParams.get('url');
            if (!url) return NextResponse.json({ error: 'URL missing' }, { status: 400 });
            
            try {
              const decoded = decodeURIComponent(url);
              
              // Path traversal protection
              if (/(\.\.\/|\.\.%2f|%2e%2e%2f|%2e%2e\/)/i.test(decoded)) {
                return NextResponse.json({ error: 'Invalid path' }, { status: 403 });
              }
              
              // Extension validation
              const ext = decoded.split('.').pop()?.toLowerCase();
              if (!ext || !ALLOWED_EXTENSIONS.has(ext)) {
                return NextResponse.json({ error: 'Invalid file type' }, { status: 400 });
              }
              
              // Path validation
              if (!ALLOWED_PATHS.some(p => decoded.startsWith(p))) {
                return NextResponse.json({ error: 'Access denied' }, { status: 403 });
              }
              
              return null;
            } catch {
              return NextResponse.json({ error: 'Invalid request' }, { status: 400 });
            }
          }
          EOF

          # Middleware principal
          cat > src/middleware.ts << 'EOF'
          import { NextRequest, NextResponse } from 'next/server';
          import { validateImageRequest } from './middleware/validateImage';

          const SENSITIVE_PARAMS = ['password', 'token', 'secret', 'api_key', 'access_token', 'private_key'];

          export async function middleware(request: NextRequest) {
            const response = NextResponse.next();
            
            // Add security headers (redundant with next.config.js)
            response.headers.set('X-Protection-Enabled', 'true');
            
            // Validate image requests
            const imageError = await validateImageRequest(request);
            if (imageError) return imageError;
            
            // Clean sensitive params from URL
            const url = request.nextUrl;
            let hasSensitiveParams = false;
            
            for (const param of SENSITIVE_PARAMS) {
              if (url.searchParams.has(param)) {
                url.searchParams.delete(param);
                hasSensitiveParams = true;
              }
            }
            
            if (hasSensitiveParams) {
              return NextResponse.redirect(url, 301);
            }
            
            // Rate limiting headers (if needed)
            // response.headers.set('X-RateLimit-Limit', '100');
            
            return response;
          }

          export const config = {
            matcher: [
              '/((?!api|_next/static|_next/image|favicon.ico|.*\\.(?:svg|png|jpg|jpeg|gif|webp)$).*)',
              '/_next/image',
            ],
          };
          EOF

      - name: 🔍 ESLint Security Check
        run: |
          # Installation des plugins de sécurité
          npm install --save-dev \
            eslint-plugin-security \
            eslint-plugin-security-node \
            eslint-plugin-no-secrets \
            --legacy-peer-deps || true
          
          # Configuration ESLint sécurité
          cat > .eslintrc.security.json << 'EOF'
          {
            "plugins": ["security", "security-node", "no-secrets"],
            "extends": [
              "plugin:security/recommended",
              "plugin:security-node/recommended"
            ],
            "rules": {
              "security/detect-non-literal-fs-filename": "warn",
              "security/detect-possible-timing-attacks": "error",
              "security/detect-eval-with-expression": "error",
              "security-node/detect-crlf": "error",
              "no-secrets/no-secrets": ["error", {
                "ignoreContent": ["password", "token", "secret"],
                "ignoreModules": true
              }]
            }
          }
          EOF
          
          # Scan des fichiers
          npx eslint . --config .eslintrc.security.json --no-eslintrc --ext .js,.jsx,.ts,.tsx --format json > eslint-security-report.json || true

      - name: 🔧 Fix Next.js 15 route handlers
        run: |
          # Script de correction robuste
          find . -type f -name "route.ts" -not -path "*/node_modules/*" | while read -r file; do
            echo "Processing: $file"
            
            # Sauvegarde
            cp "$file" "$file.bak"
            
            # Pattern 1: { params }: { params: { id: string } }
            sed -i -E 's/\{ params \}: \{ params: \{([^}]+)\} \}/\{ params \}: \{ params: Promise<\{\1\}> \}/g' "$file"
            
            # Pattern 2: const { id } = params
            sed -i -E 's/const \{([^}]+)\} = params([^.]|$)/const \1 = await params\2/g' "$file"
            
            # Vérification des changements
            if ! cmp -s "$file" "$file.bak"; then
              echo "✅ Fixed: $file"
            else
              rm "$file.bak"
            fi
          done

      - name: 🚀 Generate SRI hashes
        run: |
          mkdir -p docs/security
          
          # Fonction de hachage sécurisée
          generate_sri() {
            local url="$1"
            local tmp_file="/tmp/sri_$$.tmp"
            
            # Téléchargement avec timeout et retry
            curl -sL --retry 3 --max-time 10 "$url" -o "$tmp_file"
            if [ $? -eq 0 ] && [ -s "$tmp_file" ]; then
              openssl dgst -sha384 -binary < "$tmp_file" | openssl base64 -A
            else
              echo "⚠ Failed to download $url" >&2
              echo ""
            fi
            rm -f "$tmp_file"
          }
          
          # Génération des hashes
          BS_SHA=$(generate_sri "https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js")
          JQ_SHA=$(generate_sri "https://code.jquery.com/jquery-3.6.0.min.js")
          MD_SHA=$(generate_sri "https://cdn.jsdelivr.net/npm/@mdi/font@7.2.96/css/materialdesignicons.min.css")
          
          # Rapport SRI
          cat > docs/security/sri-hashes.md << EOF
          # 🔒 Subresource Integrity (SRI) Hashes
          
          Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          ## Bootstrap 5.3.0
          \`\`\`html
          <script 
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-${BS_SHA}" 
            crossorigin="anonymous">
          </script>
          \`\`\`
          
          ## jQuery 3.6.0
          \`\`\`html
          <script 
            src="https://code.jquery.com/jquery-3.6.0.min.js"
            integrity="sha384-${JQ_SHA}" 
            crossorigin="anonymous">
          </script>
          \`\`\`
          
          ## Material Design Icons 7.2.96
          \`\`\`html
          <link 
            rel="stylesheet" 
            href="https://cdn.jsdelivr.net/npm/@mdi/font@7.2.96/css/materialdesignicons.min.css"
            integrity="sha384-${MD_SHA}" 
            crossorigin="anonymous"/>
          \`\`\`
          EOF

      - name: 📝 Commit security fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        id: commit
        with:
          commit_message: "🔒 security: automated hardening fixes [skip ci]"
          commit_user_name: "Security Bot"
          commit_user_email: "security-bot@users.noreply.github.com"
          commit_author: "Security Bot <security-bot@users.noreply.github.com>"
          file_pattern: |
            next.config.js
            src/middleware.ts
            src/middleware/validateImage.ts
            .eslintrc.security.json
            docs/security/*.md
            package*.json
            **/route.ts
            **/History/page.tsx
          skip_dirty_check: false
          disable_globbing: true

      - name: 📤 Upload security artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-hardening-${{ github.sha }}
          path: |
            *.json
            docs/security/
            .eslintrc.security.json
          retention-days: 30

  zap-scan:
    name: 🕷️ ZAP Security Scan
    runs-on: ubuntu-latest
    needs: security-hardening
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feature/Docker_v2' || github.ref == 'refs/heads/main')
    
    # Environnement Docker avec réseau partagé
    services:
      app:
        image: node:${{ env.NODE_VERSION }}
        options: >-
          --network bridge
          --name app-container
          --workdir /app
        volumes:
          - ${{ github.workspace }}:/app
        command: sh -c "npm install && npm run build && npm start"
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐳 Docker network inspection
        run: |
          echo "=== Docker Network Info ==="
          docker network ls
          docker network inspect bridge
          echo "=== Container IPs ==="
          docker inspect -f '{{.Name}} - {{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $(docker ps -aq) 2>/dev/null || true

      - name: 🔧 Setup application
        run: |
          # Installation des dépendances
          npm ci || npm install
          
          # Configuration environnement
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            printf '%s' "${{ secrets.ENV_FILE }}" > .env.local
          else
            cp .env.example .env.local 2>/dev/null || true
          fi
          
          # Build
          NEXT_TYPESCRIPT_IGNORE_BUILD_ERRORS=1 npm run build

      - name: 🚀 Start application
        id: start-app
        run: |
          # Démarrer l'application en arrière-plan
          PORT=${{ env.APP_PORT }} npm start &
          APP_PID=$!
          echo "app_pid=$APP_PID" >> $GITHUB_OUTPUT
          
          # Attendre le démarrage avec healthcheck
          timeout=60
          counter=0
          while [ $counter -lt $timeout ]; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:${{ env.APP_PORT }} | grep -q "200\|301\|302"; then
              echo "✅ Application started on port ${{ env.APP_PORT }}"
              exit 0
            fi
            sleep 2
            counter=$((counter + 2))
            echo "⏳ Waiting for app... $counter/$timeout seconds"
          done
          
          echo "❌ Application failed to start within $timeout seconds"
          exit 1

      - name: 🕷️ Run ZAP Baseline Scan (Docker)
        id: zap-scan
        run: |
          # Obtenir l'IP du conteneur app
          APP_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' app-container 2>/dev/null || echo "localhost")
          
          # Si pas d'IP, utiliser localhost
          if [ -z "$APP_IP" ] || [ "$APP_IP" = "null" ]; then
            APP_IP="localhost"
          fi
          
          echo "Target URL: http://${APP_IP}:${{ env.APP_PORT }}"
          
          # Lancer ZAP
          docker run --rm \
            --network bridge \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            -e "HOME=/zap/wrk" \
            -u root:root \
            ${{ env.ZAP_IMAGE }} \
            zap-baseline.py \
              -t "http://${APP_IP}:${{ env.APP_PORT }}" \
              -J zap-report.json \
              -w zap-report.md \
              -r zap-report.html \
              -I \
              -a || true
          
          # Vérifier la génération des rapports
          if [ -f zap-report.json ]; then
            echo "zap_report=zap-report.json" >> $GITHUB_OUTPUT
          fi

      - name: 📊 Parse and display ZAP results
        if: always() && steps.zap-scan.outputs.zap_report != ''
        run: |
          if [ -f zap-report.json ]; then
            echo "## 🔍 ZAP Scan Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Compter les alertes par sévérité
            HIGH=$(jq '[.site[]?.alerts[]? | select(.riskcode=="3")] | length' zap-report.json 2>/dev/null || echo 0)
            MEDIUM=$(jq '[.site[]?.alerts[]? | select(.riskcode=="2")] | length' zap-report.json 2>/dev/null || echo 0)
            LOW=$(jq '[.site[]?.alerts[]? | select(.riskcode=="1")] | length' zap-report.json 2>/dev/null || echo 0)
            INFO=$(jq '[.site[]?.alerts[]? | select(.riskcode=="0")] | length' zap-report.json 2>/dev/null || echo 0)
            
            echo "### Alert Summary" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔴 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟢 Low | $LOW |" >> $GITHUB_STEP_SUMMARY
            echo "| 🔵 Info | $INFO |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Afficher les alertes High
            if [ "$HIGH" -gt 0 ]; then
              echo "### 🔴 High Risk Alerts" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              jq -r '.site[]?.alerts[]? | select(.riskcode=="3") | "• \(.name): \(.count) occurrences"' zap-report.json | sort -u >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: 📤 Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports-${{ github.sha }}
          path: |
            zap-report.*
            !zap-report.json  # Exclure le JSON si trop volumineux
            zap-report.json
          retention-days: 30
          compression-level: 9

      - name: 🔍 Check for High Risk Vulnerabilities
        if: always()
        run: |
          if [ -f zap-report.json ]; then
            HIGH_ALERTS=$(jq '[.site[]?.alerts[]? | select(.riskcode=="3")] | length' zap-report.json)
            if [ "$HIGH_ALERTS" -gt 0 ]; then
              echo "❌ Found $HIGH_ALERTS high risk vulnerabilities"
              echo "::warning::High risk vulnerabilities detected: $HIGH_ALERTS"
              # Ne pas échouer le build pour permettre l'analyse
              # exit 1
            else
              echo "✅ No high risk vulnerabilities detected"
            fi
          fi

      - name: 🧹 Cleanup
        if: always()
        run: |
          # Arrêter l'application
          if [ -n "${{ steps.start-app.outputs.app_pid }}" ]; then
            kill ${{ steps.start-app.outputs.app_pid }} 2>/dev/null || true
          fi
          
          # Nettoyer les fichiers temporaires
          rm -f /tmp/sri_*.tmp 2>/dev/null || true
