name: Security Hardening - Fix ZAP Vulnerabilities

on:
  workflow_dispatch:
  push:
    branches: [main, develop, feature/Docker_v2]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  security-hardening:
    name: Apply All Security Fixes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate package-lock.json
        run: |
          # Supprimer l'ancien fichier de verrouillage
          rm -f package-lock.json
          
          # Installer les dépendances pour générer un nouveau fichier de verrouillage
          npm install
          
          # Vérifier que le fichier a été généré
          ls -la package-lock.json

      - name: Rewrite next.config.js with security headers
        run: |
          cat > next.config.js << 'CONFIGEOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            poweredByHeader: false,
            typescript: {
              ignoreBuildErrors: true,
            },
            async headers() {
              const securityHeaders = [
                {
                  key: 'Content-Security-Policy',
                  value: [
                    "default-src 'self'",
                    "script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://code.jquery.com",
                    "style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com",
                    "font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net",
                    "img-src 'self' data: blob:",
                    "connect-src 'self'",
                    "frame-ancestors 'none'",
                    "object-src 'none'",
                    "base-uri 'self'",
                    "form-action 'self'",
                  ].join('; '),
                },
                { key: 'X-Frame-Options', value: 'DENY' },
                { key: 'Cross-Origin-Embedder-Policy', value: 'require-corp' },
                { key: 'Cross-Origin-Opener-Policy', value: 'same-origin' },
                { key: 'Cross-Origin-Resource-Policy', value: 'same-origin' },
                { key: 'Permissions-Policy', value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=()' },
                { key: 'X-Content-Type-Options', value: 'nosniff' },
                { key: 'Strict-Transport-Security', value: 'max-age=63072000; includeSubDomains; preload' },
                { key: 'Referrer-Policy', value: 'strict-origin-when-cross-origin' },
              ];
              return [{ source: '/(.*)', headers: securityHeaders }];
            },
          };
          module.exports = nextConfig;
          CONFIGEOF

      - name: Create middleware
        run: |
          mkdir -p src/middleware
          
          # Créer le middleware de validation
          cat > src/middleware/validateImageParams.ts << 'EOF'
          import { NextRequest, NextResponse } from 'next/server';

          const ALLOWED_PREFIXES = ['/images/', '/public/'];
          const ALLOWED_EXTENSIONS = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'svg', 'ico'];
          const ALLOWED_WIDTHS = new Set([16, 32, 48, 64, 96, 128, 256, 384, 640, 750, 828, 1080, 1200, 1920, 2048, 3840]);

          export function validateImageRequest(request: NextRequest): NextResponse | null {
            if (!request.nextUrl.pathname.startsWith('/_next/image')) return null;
            
            const url = request.nextUrl.searchParams.get('url');
            const w = request.nextUrl.searchParams.get('w');
            const q = request.nextUrl.searchParams.get('q');
            
            if (!url) return NextResponse.json({ error: 'Missing url' }, { status: 400 });
            
            try {
              const decoded = decodeURIComponent(url);
              
              // Protection contre path traversal
              if (/\.\.|\/\.\.\/|%2e%2e|%252e/i.test(decoded)) {
                return NextResponse.json({ error: 'Invalid path' }, { status: 400 });
              }
              
              // Vérification de l'extension
              const ext = decoded.split('.').pop()?.toLowerCase();
              if (!ext || !ALLOWED_EXTENSIONS.includes(ext)) {
                return NextResponse.json({ error: 'Invalid extension' }, { status: 400 });
              }
              
              // Vérification des préfixes autorisés
              if (!ALLOWED_PREFIXES.some(p => decoded.startsWith(p))) {
                return NextResponse.json({ error: 'Path not allowed' }, { status: 403 });
              }
              
              // Vérification de la largeur
              if (w) {
                const width = Number(w);
                if (isNaN(width) || !ALLOWED_WIDTHS.has(width)) {
                  return NextResponse.json({ error: 'Invalid width' }, { status: 400 });
                }
              }
              
              // Vérification de la qualité
              if (q) {
                const quality = Number(q);
                if (isNaN(quality) || quality < 1 || quality > 100) {
                  return NextResponse.json({ error: 'Invalid quality' }, { status: 400 });
                }
              }
              
              return null;
            } catch {
              return NextResponse.json({ error: 'Invalid request' }, { status: 400 });
            }
          }
          EOF

          cat > src/middleware.ts << 'EOF'
          import { NextRequest, NextResponse } from 'next/server';
          import { validateImageRequest } from './middleware/validateImageParams';

          export function middleware(request: NextRequest) {
            // Validation des images Next.js
            const imgError = validateImageRequest(request);
            if (imgError) return imgError;

            // Suppression des paramètres sensibles dans les URLs
            const sensitiveParams = ['email', 'password', 'token', 'api_key'];
            const hasSensitiveParam = sensitiveParams.some(p => request.nextUrl.searchParams.has(p));
            
            if (hasSensitiveParam) {
              const cleanUrl = new URL(request.url);
              sensitiveParams.forEach(p => cleanUrl.searchParams.delete(p));
              return NextResponse.redirect(cleanUrl, { status: 301 });
            }

            return NextResponse.next();
          }

          export const config = {
            matcher: [
              '/((?!api|_next/static|_next/image|favicon.ico).*)',
              '/_next/image'
            ],
          };
          EOF

      - name: Commit security fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix(security): apply security hardening fixes"
          file_pattern: |
            package*.json
            next.config.js
            src/middleware.ts
            src/middleware/validateImageParams.ts

  verify-with-zap:
    name: Verify Fixes with ZAP
    runs-on: ubuntu-latest
    needs: security-hardening
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          # Utiliser npm install au lieu de npm ci car le lockfile peut avoir changé
          npm install

      - name: Create env file
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE_CONTENT" ]; then
            printf '%s' "$ENV_FILE_CONTENT" > .env.local
          fi

      - name: Build app
        run: npm run build

      - name: Start app
        run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: 'http://localhost:3000'
          allow_issue_writing: false
          fail_action: false
          cmd_options: '-I'

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report.*
