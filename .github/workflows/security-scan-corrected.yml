name: Security Scan & Fix

on:
  push:
    branches: [main, feature/Docker_v2]
  pull_request:
    branches: [main, feature/Docker_v2]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t app:${{ github.sha }} .

      - name: Scan Docker with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'app:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run app in Docker for ZAP
        run: |
          docker run -d -p 8080:3000 --name app-scan app:${{ github.sha }}
          sleep 10

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline-scan@v0.8.0
        with:
          target: 'http://localhost:8080'
          docker_name: 'owasp/zap2docker-stable'
          report_html_name: 'zap-report.html'
          report_json_name: 'zap-report.json'
          fail_action: true  # Bloque si HIGH/Medium

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.*

      - name: Fix security headers (Next.js + Helmet)
        run: |
          # Ajoute helmet dans package.json si absent
          npm install helmet --save
          # Exemple middleware next.config.js ou custom server pour CSP, X-Frame-Options, etc.
          cat >> next.config.js << EOF
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            async headers() {
              return [
                {
                  source: '/:path*',
                  headers: [
                    { key: 'Content-Security-Policy', value: "default-src 'self'; script-src 'self' 'unsafe-eval'" },
                    { key: 'X-Frame-Options', value: 'DENY' },
                    { key: 'X-Content-Type-Options', value: 'nosniff' },
                    { key: 'Cross-Origin-Embedder-Policy', value: 'require-corp' },
                    { key: 'Cross-Origin-Opener-Policy', value: 'same-origin' },
                    { key: 'Cross-Origin-Resource-Policy', value: 'same-origin' },
                    { key: 'Permissions-Policy', value: '' },
                    { key: 'X-Powered-By', value: 'hidden' },  # Cache via server
                  ]
                }
              ]
            },
          }
          module.exports = nextConfig
          EOF
          # Fix Path Traversal: valide input dans /next/image (ajoute dans code app si src connu)
          echo "Validez params image (whitelist: faces/, logo/) et supprimez .. dans routes."

      - name: Rebuild & Re-scan after fixes
        run: |
          docker build -t app:fix-${{ github.sha }} .
          docker stop app-scan; docker rm app-scan
          docker run -d -p 8080:3000 --name app-scan app:fix-${{ github.sha }}
          sleep 10
          # Re-ZAP
          zaproxy/action-baseline-scan@v0.8.0 avec target http://localhost:8080

      - name: Push fixed image if PR
        if: github.event_name == 'pull_request'
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker tag app:fix-${{ github.sha }} votre-repo/app:fix-${{ github.sha }}
          docker push votre-repo/app:fix-${{ github.sha }}
