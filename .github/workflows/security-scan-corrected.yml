name: Security Hardening - Fix ZAP Vulnerabilities

on:
  workflow_dispatch:
  push:
    branches: [main, develop, "feature/Docker_v2"]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  security-hardening:
    name: Apply All Security Fixes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high+ severity only)
        run: |
          npm audit --audit-level=high
          npm audit fix --force --audit-level=high || true

      - name: Rewrite next.config.js with security headers
        run: |
          cat > next.config.js << 'CONFIGEOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            poweredByHeader: false,
            typescript: {
              ignoreBuildErrors: true,
            },
            async headers() {
              return [
                {
                  source: '/(.*)',
                  headers: [
                    {
                      key: 'Content-Security-Policy',
                      value: [
                        "default-src 'self'",
                        "script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://code.jquery.com",
                        "style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com",
                        "font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net",
                        "img-src 'self' data: blob:",
                        "connect-src 'self'",
                        "frame-ancestors 'none'",
                        "object-src 'none'",
                        "base-uri 'self'",
                        "form-action 'self'",
                      ].join('; ')
                    },
                    { key: 'X-Frame-Options', value: 'DENY' },
                    { key: 'X-Content-Type-Options', value: 'nosniff' },
                    { key: 'X-XSS-Protection', value: '1; mode=block' },
                    { key: 'Strict-Transport-Security', value: 'max-age=63072000; includeSubDomains; preload' },
                    { key: 'Referrer-Policy', value: 'strict-origin-when-cross-origin' },
                    { key: 'Cross-Origin-Embedder-Policy', value: 'require-corp' },
                    { key: 'Cross-Origin-Opener-Policy', value: 'same-origin' },
                    { key: 'Cross-Origin-Resource-Policy', value: 'same-origin' },
                    { key: 'Permissions-Policy', value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=()' }
                  ]
                }
              ];
            },
          };
          module.exports = nextConfig;
          CONFIGEOF

      - name: Generate SRI hashes
        run: |
          mkdir -p docs
          sri() { curl -sL "$1" | openssl dgst -sha384 -binary | openssl base64 -A; }
          BS="sha384-$(sri 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js')"
          JQ="sha384-$(sri 'https://code.jquery.com/jquery-3.6.0.min.js')"
          MD="sha384-$(sri 'https://cdn.jsdelivr.net/npm/@mdi/font@7.2.96/css/materialdesignicons.min.css')"
          cat > docs/sri-hashes.md << EOF
          # SRI Hashes

          ## Bootstrap 5.3.0
          \`\`\`html
          <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
                  integrity="${BS}" crossorigin="anonymous"></script>
          \`\`\`

          ## jQuery 3.6.0
          \`\`\`html
          <script src="https://code.jquery.com/jquery-3.6.0.min.js"
                  integrity="${JQ}" crossorigin="anonymous"></script>
          \`\`\`

          ## MDI 7.2.96
          \`\`\`html
          <link rel="stylesheet"
                href="https://cdn.jsdelivr.net/npm/@mdi/font@7.2.96/css/materialdesignicons.min.css"
                integrity="${MD}" crossorigin="anonymous"/>
          \`\`\`
          EOF

      - name: Fix Next.js 15 route handlers ✅ CORRIGÉ
        run: |
          cat > /tmp/fix-route-handlers.js << 'JS_EOF'
          const fs = require('fs');
          const path = require('path');

          function fixRouteHandler(filePath) {
            let content = fs.readFileSync(filePath, 'utf8');
            const original = content;

            // Fix 1: { params }: { params: { id: string } } -> { params }: { params: Promise<{ id: string }> }
            content = content.replace(
              /\\{\s*params\\s*\\}:\\s*\\{\\s*params\\s*:\\s*(\\{[^}]+\\})\\s*\\}/g,
              '{ params }: { params: Promise<$1> }'
            );

            // Fix 2: const { id } = params -> const { id } = await params
            content = content.replace(
              /const\\s+([\\{][^}]+[\\}])\\s*=\\s*params(?!\\s*\\.|await)/g,
              'const $1 = await params'
            );

            if (content !== original) {
              fs.writeFileSync(filePath, content);
              console.log('✅ Fixed: ' + filePath);
              return true;
            }
            return false;
          }

          function findRouteFiles(dir) {
            const files = fs.readdirSync(dir, { withFileTypes: true });
            const routeFiles = [];
            
            for (const file of files) {
              const fullPath = path.join(dir, file.name);
              if (file.isDirectory()) {
                routeFiles.push(...findRouteFiles(fullPath));
              } else if (file.name === 'route.ts' || file.name === 'route.js') {
                routeFiles.push(fullPath);
              }
            }
            return routeFiles;
          }

          try {
            const routeFiles = findRouteFiles('.');
            console.log(`Found ${routeFiles.length} route files`);

            let fixedCount = 0;
            for (const file of routeFiles) {
              if (fixRouteHandler(file)) fixedCount++;
            }
            console.log(`✅ Fixed ${fixedCount} route handlers`);
          } catch (error) {
            console.error('❌ Error:', error.message);
            process.exit(1);
          }
          JS_EOF

          node /tmp/fix-route-handlers.js

      - name: Create security middleware
        run: |
          mkdir -p src/middleware
          cat > src/middleware.ts << 'MIDDLEWARE_EOF'
          import { NextRequest, NextResponse } from 'next/server';

          export function middleware(request: NextRequest) {
            const url = request.nextUrl;

            // Block sensitive params in query strings
            const sensitiveParams = ['email', 'password', 'token', 'secret', 'api_key', 'access_token'];
            for (const param of sensitiveParams) {
              if (url.searchParams.has(param)) {
                const cleanUrl = new URL(request.url);
                cleanUrl.searchParams.delete(param);
                return NextResponse.redirect(cleanUrl, 301);
              }
            }

            // Image optimization path traversal protection
            if (url.pathname.startsWith('/_next/image')) {
              const imageUrl = url.searchParams.get('url');
              if (imageUrl) {
                const decoded = decodeURIComponent(imageUrl);
                if (/\\.{2,}/i.test(decoded) || /%2e%2e/i.test(decoded)) {
                  return NextResponse.json({ error: 'Invalid path' }, { status: 400 });
                }
              }
            }

            return NextResponse.next();
          }

          export const config = {
            matcher: [
              '/((?!api|_next/static|_next/image|favicon.ico).*)',
              '/_next/image'
            ]
          };
          MIDDLEWARE_EOF

      - name: Add ESLint security rules
        run: |
          npm install --save-dev eslint-plugin-security@latest --legacy-peer-deps || true
          cat > .eslintrc.security.json << 'ESLINT_EOF'
          {
            "extends": ["plugin:security/recommended"],
            "rules": {
              "security/detect-object-injection": "warn",
              "security/detect-possible-timing-attacks": "warn",
              "security/detect-buffer-noassert": "error"
            }
          }
          ESLINT_EOF

      - name: Commit security fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "security: apply automated ZAP vulnerability fixes"
          file_pattern: |
            package*.json
            next.config.js
            docs/sri-hashes.md
            src/middleware.ts
            .eslintrc.security.json

  zap-scan:
    name: ZAP Security Scan
    runs-on: ubuntu-latest
    needs: security-hardening
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feature/Docker_v2' || github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup .env.local
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          echo "$ENV_FILE_CONTENT" > .env.local
          echo ".env.local" >> .gitignore

      - name: Build application
        run: npm run build
        env:
          NEXT_TYPESCRIPT_IGNORE_BUILD_ERRORS: 1

      - name: Start application
        run: |
          npm start &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV
          
          for i in {1..30}; do
            if curl -f http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ App ready on port 3000"
              break
            fi
            echo "Waiting for app... ($i/30)"
            sleep 2
          done || (echo "❌ App failed to start"; exit 1)

      - name: Get runner IP
        id: runner-ip
        run: |
          IP=$(ip route get 1 | awk '{print $NF; exit}')
          echo "runner_ip=$IP" >> $GITHUB_OUTPUT
          echo "Runner IP: $IP"

      - name: Run ZAP Baseline Scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            --network host \
            -u "$(id -u):$(id -g)" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "http://${{ steps.runner-ip.outputs.runner_ip }}:3000" \
              -J zap-report.json \
              -w zap-report.md \
              -r zap-report.html \
              || true

      - name: Upload ZAP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report-${{ github.sha }}
          path: |
            zap-report*.*
          retention-days: 30

      - name: Fail on High Risk Alerts
        if: always()
        run: |
          if grep -q '"risk":"High"' zap-report.json 2>/dev/null; then
            echo "❌ High risk vulnerabilities found!"
            exit 1
          fi
          echo "✅ No high risk vulnerabilities detected"
